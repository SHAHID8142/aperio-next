[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aperio-next"
version = "1.2.0rc2"
description = "Universal, agent-agnostic context, memory, and reliability tooling with an optional software-development workflow."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SHAHID8142" }]
keywords = ["agents", "context", "memory", "reliability", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
]
# Runtime uses the Python standard library only. No third-party runtime
# dependencies are permitted until a documented need exists (see docs/conventions.md).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
aperio = "aperio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aperio = [
  "benchmark_cases/*.json",
  "skill_packs/*.md",
  # Every integration asset must ship, including Gemini CLI's TOML command
  # template. A missed extension here silently breaks host registration in a
  # wheel install while working from a source checkout (see test_packaging).
  "integration_assets/*.md",
  "integration_assets/*.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
