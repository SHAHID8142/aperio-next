[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aperio-next"
version = "0.13.0"
description = "Universal, agent-agnostic context, memory, and reliability tooling with an optional software-development workflow."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SHAHID8142" }]
keywords = ["agents", "context", "memory", "reliability", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
]
# Runtime uses the Python standard library only. No third-party runtime
# dependencies are permitted until a documented need exists (see docs/conventions.md).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
aperio = "aperio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
